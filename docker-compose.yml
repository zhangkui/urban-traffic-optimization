services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    environment:
      URBAN_TRAFFIC_OPTIMIZATION_ADDR: ":8080"
      URBAN_TRAFFIC_OPTIMIZATION_DB: "/data/urban-traffic-optimization.db"
    volumes: ["traffic-data:/data"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./web:/app"]
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
volumes:
  traffic-data:
  postgres-data:
